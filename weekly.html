<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週次MTGレポート | 就活の名人 KPIボード</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #f2faf7;
      --surface:   #ffffff;
      --border:    #d0e8df;
      --sidebar-bg:#c8eadb;
      --text-primary:   #0a1f18;
      --text-secondary: #52766a;
      --accent:    #18a572;
      --accent-lt: #e0f5ec;
      --accent-dk: #0f7a54;
      --green:     #18a572;
      --orange:    #e8960a;
      --red:       #dc4545;
      --gold:      #d4900a;
      --shadow-sm: 0 1px 4px rgba(0,50,30,0.06), 0 4px 16px rgba(0,50,30,0.05);
      --shadow:    0 2px 8px rgba(0,50,30,0.07), 0 8px 24px rgba(0,50,30,0.06);
      --shadow-lg: 0 4px 12px rgba(0,50,30,0.08), 0 16px 40px rgba(0,50,30,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', 'Noto Sans JP', sans-serif; background: #fafafa; color: var(--text-primary); font-size: 14px; line-height: 1.6; }
    #sidebar-main { background: #ffffff; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Header ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 54px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
      box-shadow: 0 1px 0 var(--border), 0 2px 12px rgba(0,50,30,0.06);
      position: sticky; top: 0; z-index: 100;
    }
    .header-logo { display: flex; align-items: center; gap: 10px; }
    .header-logo-dot {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dk));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; }
    .header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .month-select-wrap { display: flex; align-items: center; gap: 6px; }
    .month-select-wrap label { font-size: 12px; color: var(--text-secondary); }
    #monthSelect {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text-primary); padding: 5px 10px 5px 12px;
      border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      transition: border-color 0.15s;
    }
    #monthSelect:hover { border-color: var(--accent); }
    .updated-label { font-size: 11px; color: var(--text-secondary); background: var(--bg); padding: 4px 10px; border-radius: 99px; }
    .back-btn {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: var(--accent);
      background: var(--accent-lt); border: 1px solid var(--accent);
      border-radius: 8px; padding: 5px 12px; text-decoration: none;
      transition: background 0.15s;
    }
    .back-btn:hover { background: var(--accent); color: #fff; }

    /* ---- Loading / Error ---- */
    #loading-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 16px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    #error-screen {
      display: none; max-width: 480px; margin: 60px auto; text-align: center;
      background: var(--surface); border-radius: 14px; padding: 40px;
      box-shadow: var(--shadow);
    }
    #error-screen .err-icon { font-size: 40px; margin-bottom: 12px; }
    #error-screen h2 { color: var(--red); margin-bottom: 10px; font-size: 16px; }
    #error-screen p  { color: var(--text-secondary); font-size: 13px; line-height: 1.7; }

    /* ---- Dashboard ---- */
    #dashboard { display: none; }
    .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px 48px; }

    .section { margin-bottom: 32px; }
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--text-secondary);
      letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::before {
      content: ''; display: inline-block;
      width: 3px; height: 13px; border-radius: 99px;
      background: linear-gradient(to bottom, var(--accent), var(--accent-dk));
    }

    /* ---- Sidebar ---- */
    .layout-wrap { display: flex; align-items: flex-start; min-height: calc(100vh - 54px); }

    #sidebar {
      width: 210px;
      flex-shrink: 0;
      position: sticky;
      top: 54px;
      height: calc(100vh - 54px);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 0 40px;
    }
    #sidebar .nav-group-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.4px;
      text-transform: uppercase; color: var(--text-secondary);
      padding: 4px 18px 6px; margin-top: 18px; opacity: 0.75;
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 14px 9px 20px;
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      user-select: none;
      text-decoration: none;
      border-radius: 0 10px 10px 0;
      margin-right: 10px;
    }
    .nav-item:hover { background: rgba(255,255,255,0.55); color: var(--text-primary); }
    .nav-item.active {
      background: var(--surface);
      color: var(--accent-dk);
      border-left-color: var(--accent);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,60,40,0.12);
    }
    .nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }

    #sidebar-main { flex: 1; overflow: hidden; }

    /* ── 週次MTGレポート ── */
    .weekly-bizbar-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .weekly-bizbar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .weekly-bizbar-label { font-weight: 700; font-size: 14px; color: var(--text-primary); }
    .weekly-bizbar-stat  { font-size: 13px; color: var(--text-secondary); }
    .weekly-bizbar-bg    { background: var(--border); border-radius: 99px; height: 10px; overflow: hidden; }
    .weekly-bizbar-fill  { height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--accent-dk), var(--accent)); transition: width 1s cubic-bezier(0.22,1,0.36,1); }

    /* ── 最重要KPIパネル ── */
    .hero-pace-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    .hero-pace-card { background: var(--surface); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); border: 1px solid var(--border); border-top: 4px solid; position: relative; overflow: hidden; }
    .hero-pace-card::after { content:''; position:absolute; top:0; right:0; width:80px; height:80px; border-radius:50%; opacity:0.08; transform:translate(30px,-30px); }
    .hero-pace-title { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .hero-pace-nums  { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .hero-pace-result { font-size: 40px; font-weight: 900; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
    .hero-pace-target { font-size: 13px; color: var(--text-secondary); }
    .hero-pace-bar-bg   { background: var(--border); border-radius: 99px; height: 5px; margin: 8px 0; overflow: hidden; }
    .hero-pace-bar-fill { height: 5px; border-radius: 99px; transition: width 1s cubic-bezier(0.22,1,0.36,1); }
    .hero-pace-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
    .hero-pace-pct  { font-size: 12px; color: var(--text-secondary); }
    .hero-pace-badge { font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 10px; color: #fff; }
    @media (max-width: 768px) { .hero-pace-grid { grid-template-columns: 1fr; } }

    .weekly-signal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .signal-card { border-radius: 14px; border: 1.5px solid; padding: 16px 18px; box-shadow: var(--shadow-sm); }
    .signal-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .signal-emoji { font-size: 20px; }
    .signal-name  { font-weight: 700; font-size: 15px; color: var(--text-primary); flex: 1; }
    .signal-badge { font-size: 10px; font-weight: 700; color: #fff; border-radius: 99px; padding: 2px 8px; letter-spacing: 0.5px; }
    .signal-kpi-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; }
    .signal-kpi-name   { color: var(--text-secondary); min-width: 60px; font-size: 11px; }
    .signal-kpi-val    { font-weight: 700; font-size: 14px; color: var(--text-primary); }
    .signal-kpi-target { font-size: 11px; color: var(--text-secondary); font-weight: 400; }
    .signal-kpi-pace   { margin-left: auto; font-weight: 700; font-size: 12px; }

    .weekly-action-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .weekly-action-list  { display: flex; flex-direction: column; gap: 12px; }
    .action-card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); border-left: 4px solid; padding: 16px 20px; box-shadow: var(--shadow-sm); }
    .action-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 15px; font-weight: 700; }
    .action-card-name   { flex: 1; color: var(--text-primary); }
    .action-card-badge  { font-size: 11px; font-weight: 700; color: #fff; border-radius: 99px; padding: 2px 10px; }
    .action-kpi-row     { display: grid; grid-template-columns: 80px 1fr; gap: 4px 12px; align-items: baseline; margin-bottom: 10px; font-size: 13px; }
    .action-kpi-name    { font-weight: 700; color: var(--text-primary); }
    .action-kpi-progress{ color: var(--text-secondary); }
    .action-kpi-need    { grid-column: 2; font-size: 12px; color: var(--text-secondary); }
    .weekly-all-ok { background: #f0fdf4; border: 1px solid #86efac; border-radius: 12px; padding: 18px 22px; color: #16a34a; font-weight: 700; font-size: 14px; text-align: center; }

    @media (max-width: 768px) {
      header { padding: 12px 16px; }
      #sidebar { display: none; }
      .weekly-signal-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
// ======================================================
// Google Sheets 設定
// ======================================================
const SHEET_ID = '11Y_h32hfgbiz_3BWwV_NIGYJJyxJ5l6SnRB9pS6Iv2g';
const GID      = '1288413773';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

const PERSONS_LIST = ['渡辺', '田中', '永田', '志村'];

const NON_PERSON_PATTERNS = [
  /^[0-9０-９]+月$/,
  /^(目標|結果|合計|小計|ALL|年間|備考)$/,
  /^(新規面談|提案数|応募承諾数|内定数|参加率|提案率)/,
];

const COL_MAP = {
  1:  '新規面談',
  2:  '再面談数',
  4:  '提案人数',
  6:  '提案数',
  7:  '応募承諾数',
  10: '説明会参加済み',
  12: '1次選考参加数',
  14: '最終参加数',
  16: '内定数',
};

const HEADER_ALIASES = {
  '新規面談':        '新規面談',
  '当月新規再面談数': '再面談数',
  '再面談数':        '再面談数',
  '新規～提案人数':   '提案人数',
  '提案人数':        '提案人数',
  '提案数':          '提案数',
  '応募承諾数':      '応募承諾数',
  '説明会参加済み':   '説明会参加済み',
  '1次選考参加数':    '1次選考参加数',
  '最終参加数':      '最終参加数',
  '内定数':          '内定数',
  '内定承諾数':      '内定承諾数',
};

// ======================================================
// CSV パーサー
// ======================================================
function safeNum(v) {
  if (!v || v.trim() === '' || v.includes('#')) return 0;
  return parseFloat(v.replace(/,/g, '').trim()) || 0;
}

function parseCSV(text) {
  const rows = [];
  for (const line of text.split('\n')) {
    const row = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { row.push(cur); cur = ''; }
      else { cur += c; }
    }
    row.push(cur);
    rows.push(row.map(s => s.trim().replace(/^"|"$/g, '')));
  }
  return rows;
}

function parseSheetData(csvText) {
  const rows = parseCSV(csvText);
  const personsData = {};
  const monthsSeen  = [];
  let curPerson = null, curMonth = null;
  let dynColMap = {};

  for (const row of rows) {
    if (!row.length) continue;
    const col0 = row[0].trim();

    if (col0 && !NON_PERSON_PATTERNS.some(p => p.test(col0))) {
      curPerson = col0;
      curMonth  = null;
      dynColMap = {};
      if (!personsData[curPerson]) personsData[curPerson] = {};
      continue;
    }

    if (curPerson && /^[0-9０-９]+月$/.test(col0)) {
      curMonth = col0.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0));
      if (!monthsSeen.includes(curMonth)) monthsSeen.push(curMonth);
      if (!personsData[curPerson][curMonth])
        personsData[curPerson][curMonth] = { target: {}, result: {} };

      dynColMap = {};
      for (let i = 1; i < row.length; i++) {
        const h = row[i].trim();
        if (h && HEADER_ALIASES[h]) dynColMap[HEADER_ALIASES[h]] = i;
      }
      continue;
    }

    if (curPerson && curMonth && (col0 === '目標' || col0 === '結果')) {
      const type = col0 === '目標' ? 'target' : 'result';
      const parsed = {};
      if (Object.keys(dynColMap).length > 0) {
        for (const [kpiName, idx] of Object.entries(dynColMap)) {
          parsed[kpiName] = safeNum(row[idx] ?? '');
        }
      } else {
        for (const [idx, name] of Object.entries(COL_MAP)) {
          parsed[name] = safeNum(row[idx] ?? '');
        }
      }
      personsData[curPerson][curMonth][type] = parsed;
    }
  }

  return { personsData, months: monthsSeen };
}

// ======================================================
// 週次MTGレポート
// ======================================================
function getBusinessDays(year, month) {
  const days = [];
  const d = new Date(year, month - 1, 1);
  while (d.getMonth() === month - 1) {
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) days.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }
  return days;
}

function renderWeeklyReport(personsData, month) {
  const container = document.getElementById('weekly-content');
  if (!container) return;

  const monthNum = parseInt(month);
  if (isNaN(monthNum)) {
    container.innerHTML = '<p style="color:var(--text-secondary)">月次データを選択してください</p>';
    return;
  }

  // 年度：常に現在の西暦年を使用（3月は2026年3月として扱う）
  const now      = new Date();
  const curYear  = now.getFullYear();
  const year     = curYear;

  const allBizDays   = getBusinessDays(year, monthNum);
  const totalBiz     = allBizDays.length;
  const monthStart   = new Date(year, monthNum - 1, 1);
  const monthEnd     = new Date(year, monthNum, 0);
  const todayMid     = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  let elapsedBiz;
  if (todayMid > monthEnd)        elapsedBiz = totalBiz;
  else if (todayMid < monthStart) elapsedBiz = 0;
  else elapsedBiz = allBizDays.filter(d => d <= todayMid).length;

  const remainBiz = totalBiz - elapsedBiz;
  const bizPct    = totalBiz > 0 ? Math.round(elapsedBiz / totalBiz * 100) : 0;
  const isPast    = todayMid > monthEnd;
  const isFuture  = todayMid < monthStart;
  const statusStr = isPast ? '（月終了）' : isFuture ? '（未来月）' : `残り ${remainBiz} 営業日`;

  const PERSONS  = Object.keys(personsData);
  const KEY_KPIS = [
    { key: '新規面談',       label: '新規面談'   },
    { key: '提案数',         label: '提案数'     },
    { key: '応募承諾数',     label: '応募承諾'   },
    { key: '説明会参加済み', label: '説明会参加' },
    { key: '1次選考参加数',  label: '1次選考'    },
    { key: '最終参加数',     label: '最終参加'   },
    { key: '内定数',         label: '内定数'     },
    { key: '内定承諾数',     label: '内定承諾'   },
  ];

  function calcPace(result, target) {
    if (target === 0 || totalBiz === 0 || elapsedBiz === 0) return null;
    return (result / target) / (elapsedBiz / totalBiz);
  }
  function paceStatus(pace) {
    if (pace === null) return 'none';
    if (pace >= 1.0)   return 'ok';
    if (pace >= 0.8)   return 'warn';
    return 'behind';
  }

  const personPace = {};
  PERSONS.forEach(p => {
    const d = personsData[p][month];
    if (!d) return;
    personPace[p] = {};
    KEY_KPIS.forEach(({ key }) => {
      const result = d.result[key] ?? 0;
      const target = d.target[key] ?? 0;
      const pace   = calcPace(result, target);
      const status = paceStatus(pace);
      const needed = Math.max(0, target - result);
      personPace[p][key] = { result, target, pace, status, needed,
        dailyNeeded: remainBiz > 0 ? needed / remainBiz : needed };
    });
  });

  function overallStatus(pp) {
    const statuses = Object.values(pp).map(v => v.status);
    if (statuses.includes('behind')) return 'behind';
    if (statuses.includes('warn'))   return 'warn';
    if (statuses.includes('ok'))     return 'ok';
    return 'none';
  }

  const SC = {
    ok:     { emoji: '🟢', label: '順調',      color: '#16a34a', bg: '#f0fdf4', border: '#86efac' },
    warn:   { emoji: '🟡', label: '注意',      color: '#d97706', bg: '#fffbeb', border: '#fcd34d' },
    behind: { emoji: '🔴', label: '要フォロー', color: '#dc2626', bg: '#fff5f5', border: '#fca5a5' },
    none:   { emoji: '⚪', label: 'データなし', color: '#9ca3af', bg: '#f9fafb', border: '#e5e7eb' },
  };

  let html = '';

  // 1. 営業日プログレスバー
  html += `
    <div class="weekly-bizbar-wrap">
      <div class="weekly-bizbar-header">
        <span class="weekly-bizbar-label">📅 ${year}年${monthNum}月 営業日進捗</span>
        <span class="weekly-bizbar-stat">${elapsedBiz} / ${totalBiz} 日経過（${bizPct}%）　${statusStr}</span>
      </div>
      <div class="weekly-bizbar-bg">
        <div class="weekly-bizbar-fill" id="weekly-biz-fill" style="width:0%"></div>
      </div>
    </div>`;

  // 2. 最重要KPI チーム合計ペースカード
  const HERO_KPIS = [
    { key: '内定承諾数',    label: '⭐ 内定承諾数', color: '#d4900a', barColor: 'linear-gradient(90deg,#b8760a,#d4900a)', bgColor: '#fffbeb' },
    { key: '内定数',        label: '🏅 内定数',     color: '#18a572', barColor: 'linear-gradient(90deg,#0f7a54,#18a572)', bgColor: '#f0fdf4' },
    { key: '1次選考参加数', label: '📋 1次選考',    color: '#3b82f6', barColor: 'linear-gradient(90deg,#1d4ed8,#3b82f6)', bgColor: '#eff6ff' },
  ];
  html += `<div class="hero-pace-grid">`;
  HERO_KPIS.forEach(({ key, label, color, barColor, bgColor }) => {
    const totResult = PERSONS.reduce((s, p) => s + (personsData[p]?.[month]?.result?.[key] ?? 0), 0);
    const totTarget = PERSONS.reduce((s, p) => s + (personsData[p]?.[month]?.target?.[key] ?? 0), 0);
    const pace   = calcPace(totResult, totTarget);
    const status = paceStatus(pace);
    const paceDisp = pace !== null ? Math.round(pace * 100) : null;
    const achPct   = totTarget > 0 ? Math.round(totResult / totTarget * 100) : 0;
    const sc = SC[status];
    const barId = `hero-pace-bar-${key.replace(/\s/g,'')}`;
    html += `
      <div class="hero-pace-card" style="border-top-color:${color};background:${bgColor}">
        <div class="hero-pace-card" style="position:absolute;top:0;right:0;width:80px;height:80px;background:${color};border-radius:50%;opacity:0.08;transform:translate(30px,-30px);pointer-events:none;"></div>
        <div class="hero-pace-title" style="color:${color}">${label}</div>
        <div class="hero-pace-nums">
          <span class="hero-pace-result" style="color:${color}">${totResult}</span>
          <span class="hero-pace-target">/ 目標 ${totTarget} 件</span>
        </div>
        <div class="hero-pace-bar-bg">
          <div class="hero-pace-bar-fill" id="${barId}" style="width:0%;background:${barColor}"></div>
        </div>
        <div class="hero-pace-footer">
          <span class="hero-pace-pct">達成率 ${achPct}%</span>
          ${paceDisp !== null
            ? `<span class="hero-pace-badge" style="background:${sc.color}">${sc.emoji} ペース ${paceDisp}%</span>`
            : `<span class="hero-pace-badge" style="background:#9ca3af">データなし</span>`
          }
        </div>
      </div>`;
  });
  html += `</div>`;

  // 3. 担当者別信号機カード
  html += `<div style="font-size:12px;font-weight:700;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">👤 担当者別ペース</div>`;
  html += `<div class="weekly-signal-grid">`;
  PERSONS.forEach(p => {
    const pp = personPace[p];
    if (!pp) return;
    const os = overallStatus(pp);
    const sc = SC[os];
    const kpiRows = KEY_KPIS.map(({ key, label }) => {
      const kd = pp[key];
      if (!kd) return '';
      const paceDisp  = kd.pace !== null ? Math.round(kd.pace * 100) : '-';
      const paceColor = kd.status === 'ok' ? '#16a34a' : kd.status === 'warn' ? '#d97706' : kd.status === 'behind' ? '#dc2626' : '#9ca3af';
      return `<div class="signal-kpi-row">
        <span class="signal-kpi-name">${label}</span>
        <span class="signal-kpi-val">${kd.result}<span class="signal-kpi-target">/${kd.target}</span></span>
        <span class="signal-kpi-pace" style="color:${paceColor}">${paceDisp}%</span>
      </div>`;
    }).join('');
    html += `
      <div class="signal-card" style="background:${sc.bg};border-color:${sc.border}">
        <div class="signal-card-header">
          <span class="signal-emoji">${sc.emoji}</span>
          <span class="signal-name">${p}</span>
          <span class="signal-badge" style="background:${sc.color}">${sc.label}</span>
        </div>
        <div class="signal-kpis">${kpiRows}</div>
      </div>`;
  });
  html += `</div>`;

  // 3. 要フォローリスト
  const behindPersons = PERSONS.filter(p => {
    const pp = personPace[p];
    if (!pp) return false;
    return overallStatus(pp) === 'behind' || overallStatus(pp) === 'warn';
  });

  if (behindPersons.length === 0) {
    html += `<div class="weekly-all-ok">🎉 全アドバイザーがペース通り進行中です！</div>`;
  } else {
    html += `<div class="weekly-action-title">⚠️ フォローアップが必要なアドバイザー</div>`;
    html += `<div class="weekly-action-list">`;
    behindPersons.forEach(p => {
      const pp = personPace[p];
      const os = overallStatus(pp);
      const sc = SC[os];
      const actionRows = KEY_KPIS.map(({ key, label }) => {
        const kd = pp[key];
        if (!kd || kd.status === 'ok' || kd.target === 0) return '';
        const paceDisp  = kd.pace !== null ? Math.round(kd.pace * 100) : '-';
        const paceColor = os === 'behind' ? '#dc2626' : '#d97706';
        const needStr   = remainBiz > 0
          ? `残り${remainBiz}営業日でさらに <strong>${kd.needed}件</strong> 必要（1日あたり ${kd.dailyNeeded.toFixed(1)} 件ペース）`
          : `残り営業日なし・あと <strong>${kd.needed}件</strong> 未達`;
        return `<div class="action-kpi-row">
          <span class="action-kpi-name">${label}</span>
          <span class="action-kpi-progress">${kd.result} / 目標 ${kd.target}件　ペース <b style="color:${paceColor}">${paceDisp}%</b></span>
          <span class="action-kpi-need">→ ${needStr}</span>
        </div>`;
      }).filter(Boolean).join('');
      if (!actionRows) return;
      html += `
        <div class="action-card" style="border-left-color:${sc.color}">
          <div class="action-card-header">
            <span>${sc.emoji}</span>
            <span class="action-card-name">${p}</span>
            <span class="action-card-badge" style="background:${sc.color}">${sc.label}</span>
          </div>
          <div class="action-kpis">${actionRows}</div>
        </div>`;
    });
    html += `</div>`;
  }

  container.innerHTML = html;
  setTimeout(() => {
    const fill = document.getElementById('weekly-biz-fill');
    if (fill) fill.style.width = bizPct + '%';

    // 最重要KPIバーのアニメーション
    HERO_KPIS.forEach(({ key }) => {
      const totResult = PERSONS.reduce((s, p) => s + (personsData[p]?.[month]?.result?.[key] ?? 0), 0);
      const totTarget = PERSONS.reduce((s, p) => s + (personsData[p]?.[month]?.target?.[key] ?? 0), 0);
      const achPct = totTarget > 0 ? Math.min(100, Math.round(totResult / totTarget * 100)) : 0;
      const barEl = document.getElementById(`hero-pace-bar-${key.replace(/\s/g,'')}`);
      if (barEl) barEl.style.width = achPct + '%';
    });
  }, 100);
}

// ======================================================
// 月セレクター
// ======================================================
function buildMonthSelector(months, personsData) {
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    sel.appendChild(opt);
  });
  if (months.length > 0) {
    sel.value = months[months.length - 1];
    renderWeeklyReport(personsData, sel.value);
  }
  sel.addEventListener('change', () => renderWeeklyReport(personsData, sel.value));
}

// ======================================================
// Screen helpers
// ======================================================
function showDashboard() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-screen').style.display   = 'none';
  document.getElementById('dashboard').style.display      = 'block';
}

function showError(msg) {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-screen').style.display   = 'block';
  document.getElementById('error-msg').textContent        = msg || 'データを取得できませんでした。';
}

// ======================================================
// Boot
// ======================================================
document.getElementById('updated').textContent = new Date().toLocaleString('ja-JP');

(async () => {
  try {
    const resp = await fetch(CSV_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    const { personsData, months } = parseSheetData(text);
    if (months.length > 0) {
      showDashboard();
      buildMonthSelector(months, personsData);
    } else {
      throw new Error('シートのデータが読み取れませんでした。');
    }
  } catch (e) {
    showError(e.message || 'スプレッドシートの取得に失敗しました。');
  }
})();
</script>

</html>
